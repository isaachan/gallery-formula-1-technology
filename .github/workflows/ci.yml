name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run formatting check
        run: npm run format

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Validate content
        run: npm run validate:content

      - name: Build production bundle
        run: npm run build

      - name: Upload static web export
        uses: actions/upload-artifact@v4
        with:
          name: static-web-export-${{ github.sha }}
          path: out/
          if-no-files-found: error

  ios-security-tests:
    runs-on: macos-15
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download verified static web export
        uses: actions/download-artifact@v4
        with:
          name: static-web-export-${{ github.sha }}
          path: out

      - name: Stage verified WebAssets
        run: ./ios/sync-web-assets.sh
        env:
          BUILD_COMMIT: ${{ github.sha }}
          WEB_ASSETS_SOURCE: out

      - name: Run iOS unit and UI tests
        run: npm run test:ios
