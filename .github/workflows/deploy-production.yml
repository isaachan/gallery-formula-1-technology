name: iOS Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: macos-15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web and content quality gates
        run: npm run ci
        env:
          BUILD_COMMIT: ${{ github.sha }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage and verify bundled WebAssets
        run: ./ios/sync-web-assets.sh
        env:
          BUILD_COMMIT: ${{ github.sha }}

      - name: Run iOS unit and UI tests
        run: npm run test:ios

      - name: Record immutable candidate evidence
        run: |
          shasum -a 256 ios/F1Chronicle/WebAssets/build-manifest.json > release-integrity.txt
          find ios/F1Chronicle/WebAssets -type f -exec shasum -a 256 {} \; | sort >> release-integrity.txt
          du -sk ios/F1Chronicle/WebAssets > release-size.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-candidate-${{ github.sha }}
          if-no-files-found: error
          path: |
            ios/F1Chronicle/WebAssets/build-manifest.json
            release-integrity.txt
            release-size.txt

# Signing, archive export, and TestFlight/App Store promotion remain explicit
# release-owner actions until certificate/profile management is approved.
